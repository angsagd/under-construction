<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fix the Bug</title>

  <link rel="stylesheet" href="./css/bugs.css" />
</head>
<body>

  <div class="wrapper">
    <h1>Fix the Bug</h1>

    <div class="panel">
      <div>Score: <span id="score">0</span></div>
      <div>Time: <span id="time">30</span>s</div>
      <div>Highest Score: <span id="highestScore">0</span></div>
      <div>Status: <span id="status">Ready</span></div>
    </div>

    <div id="gameArea"></div>

    <div class="controls">
      <button id="startBtn">Start</button>
      <button id="restartBtn">Restart</button>
    </div>

    <div class="hint">
      Klik bug 🐞 secepat mungkin sebelum hilang. Semakin cepat level naik, semakin banyak bug muncul.
    </div>

    <a class="back-link" href="./index.html">Kembali ke halaman utama</a>
  </div>

  <script src="./js/bugs.js"></script>

</body>
</html>
