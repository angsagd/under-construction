<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get the Code</title>

  <link rel="stylesheet" href="./css/code.css" />
</head>
<body>

  <div class="page">
    <div class="wrapper">
      <h1>Get the Code</h1>

      <div class="panel">
        <div>Score: <span id="score">0</span></div>
        <div>Highest Score: <span id="highestScore">0</span></div>
        <div>Status: <span id="status">Ready</span></div>
      </div>

      <canvas id="gameCanvas" width="800" height="500"></canvas>

      <div class="controls">
        <button id="startBtn">Start</button>
        <button id="restartBtn">Restart</button>
      </div>

      <div class="hint">
        Use the keyboard arrow keys. Eat colorful code snippets, and do not hit the walls or your own body.
      </div>
    </div>
    <a class="back-link" href="./index.html">Back to home</a>
  </div>

  <script>window.counterPage="code";</script>
  <script src="./js/counter.js"></script>
  <script src="./js/code.js"></script>

</body>
</html>
