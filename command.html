<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Type the Command</title>

  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="page-command">

  <div class="page">
    <div class="terminal">
      <h1>Type the Command</h1>

      <div class="info">
        <div>Score: <span id="score">0</span></div>
        <div>Time: <span id="time">60</span>s</div>
        <div>Highest: <span id="highestScore">0</span></div>
      </div>

      <div class="command-box" id="commandText">
        Click Start to begin typing commands.
      </div>

      <input
        type="text"
        id="commandInput"
        placeholder="Type command here..."
        autocomplete="off"
        disabled
      />

      <div class="message" id="message"></div>

      <div class="buttons">
        <button id="startBtn">Start</button>
        <button id="restartBtn" class="hidden">Restart</button>
      </div>
    </div>
    <a class="back-link" href="./index.html">Back to home</a>
  </div>
  <script src="./js/main.js"></script>

</body>
</html>
