<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Launch Countdown Puzzle</title>

  <link rel="stylesheet" href="./css/countdown.css" />
</head>
<body>

  <div class="wrapper">
    <h1>Launch Countdown Puzzle</h1>

    <div class="panel">
      <div>Time: <span id="time">0</span>s</div>
      <div>Moves: <span id="moves">0</span></div>
      <div>Best Time: <span id="bestTime">-</span></div>
      <div>Status: <span id="status">Ready</span></div>
    </div>

    <div class="puzzle" id="puzzle"></div>

    <div class="launch" id="launchText"></div>

    <div class="controls">
      <button id="startBtn">Start</button>
      <button id="shuffleBtn">Shuffle</button>
      <button id="restartBtn">Restart</button>
    </div>

    <div class="hint">
      Susun potongan menjadi urutan: 🚀 3 2 1 🔥 HTML CSS JS. Klik tile di sekitar ruang kosong untuk menggeser.
    </div>

    <a class="back-link" href="./index.html">Kembali ke halaman utama</a>
  </div>

  <script src="./js/countdown.js"></script>

</body>
</html>
