<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 Runner</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #111827, #05070d 70%);
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }

    .wrapper {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      color: #ffcc00;
      text-shadow: 0 0 12px rgba(255, 204, 0, 0.8);
    }

    .panel {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .panel div {
      flex: 1;
      min-width: 140px;
      border: 1px solid rgba(255, 204, 0, 0.45);
      background: rgba(255, 204, 0, 0.07);
      padding: 10px;
      border-radius: 8px;
    }

    canvas {
      width: 100%;
      max-width: 800px;
      height: auto;
      background: linear-gradient(#070b14, #05070d);
      border: 2px solid #ffcc00;
      border-radius: 14px;
      box-shadow: 0 0 25px rgba(255, 204, 0, 0.22);
    }

    .controls {
      margin-top: 16px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      background: transparent;
      color: #ffcc00;
      border: 1px solid #ffcc00;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #ffcc00;
      color: #05070d;
    }

    .hint {
      margin-top: 12px;
      color: #fff1a8;
      font-size: 14px;
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <h1>404 Runner</h1>

    <div class="panel">
      <div>Score: <span id="score">0</span></div>
      <div>Highest Score: <span id="highestScore">0</span></div>
      <div>Status: <span id="status">Ready</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="420"></canvas>

    <div class="controls">
      <button id="startBtn">Start</button>
      <button id="restartBtn">Restart</button>
      <button id="jumpBtn">Jump</button>
    </div>

    <div class="hint">
      Tekan Space, Arrow Up, klik canvas, atau tombol Jump untuk melompat. Hindari obstacle seperti 404, BUG, 500, dan DELAY.
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreEl = document.getElementById("score");
    const highestScoreEl = document.getElementById("highestScore");
    const statusEl = document.getElementById("status");

    const startBtn = document.getElementById("startBtn");
    const restartBtn = document.getElementById("restartBtn");
    const jumpBtn = document.getElementById("jumpBtn");

    const HIGHEST_SCORE_KEY = "runner404HighestScore";

    let score = 0;
    let isPlaying = false;
    let isGameOver = false;
    let animationId = null;
    let frame = 0;
    let speed = 5;
    let obstacles = [];
    let particles = [];

    const groundY = 330;

    const player = {
      x: 90,
      y: groundY - 48,
      width: 42,
      height: 48,
      velocityY: 0,
      gravity: 0.75,
      jumpPower: -12,
      holdGravity: 0.28,
      releaseGravity: 1.35,
      maxJumpHoldFrames: 18,
      jumpHoldFrames: 0,
      isJumping: false,
      isJumpHeld: false
    };

    const obstacleTexts = ["404", "BUG", "500", "ERR", "DELAY", "CRASH"];

    highestScoreEl.textContent = localStorage.getItem(HIGHEST_SCORE_KEY) || 0;

    function initGame() {
      score = 0;
      frame = 0;
      speed = 5;
      obstacles = [];
      particles = [];
      isPlaying = false;
      isGameOver = false;

      player.y = groundY - player.height;
      player.velocityY = 0;
      player.isJumping = false;
      player.isJumpHeld = false;
      player.jumpHoldFrames = 0;

      scoreEl.textContent = score;
      statusEl.textContent = "Ready";

      drawGame();
    }

    function startGame() {
      if (isGameOver) {
        initGame();
      }

      if (isPlaying) return;

      isPlaying = true;
      isGameOver = false;
      statusEl.textContent = "Running";

      gameLoop();
    }

    function restartGame() {
      cancelAnimationFrame(animationId);
      initGame();
      startGame();
    }

    function gameLoop() {
      updateGame();
      drawGame();

      if (isPlaying) {
        animationId = requestAnimationFrame(gameLoop);
      }
    }

    function updateGame() {
      frame++;

      score++;
      scoreEl.textContent = score;

      if (frame % 500 === 0) {
        speed += 0.5;
      }

      updatePlayer();
      updateObstacles();
      updateParticles();

      if (frame % randomSpawnRate() === 0) {
        spawnObstacle();
      }

      if (frame % 8 === 0) {
        createDust();
      }
    }

    function updatePlayer() {
      const isRising = player.velocityY < 0;
      const canHoldJump = player.isJumpHeld && isRising && player.jumpHoldFrames < player.maxJumpHoldFrames;

      if (canHoldJump) {
        player.velocityY += player.holdGravity;
        player.jumpHoldFrames++;
      } else if (isRising) {
        player.velocityY += player.releaseGravity;
      } else {
        player.velocityY += player.gravity;
      }

      player.y += player.velocityY;

      if (player.y >= groundY - player.height) {
        player.y = groundY - player.height;
        player.velocityY = 0;
        player.isJumping = false;
        player.isJumpHeld = false;
        player.jumpHoldFrames = 0;
      }
    }

    function jump() {
      if (!isPlaying) {
        startGame();
        return;
      }

      if (!player.isJumping) {
        player.velocityY = player.jumpPower;
        player.isJumping = true;
        player.isJumpHeld = true;
        player.jumpHoldFrames = 0;
      }
    }

    function releaseJump() {
      player.isJumpHeld = false;
    }

    function randomSpawnRate() {
      return Math.max(55, 100 - Math.floor(speed * 4));
    }

    function spawnObstacle() {
      const text = obstacleTexts[Math.floor(Math.random() * obstacleTexts.length)];
      const width = text.length * 18 + 18;
      const height = 44;

      obstacles.push({
        x: canvas.width + 20,
        y: groundY - height,
        width,
        height,
        text,
        color: getObstacleColor(text)
      });
    }

    function updateObstacles() {
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= speed;

        if (checkCollision(player, obs)) {
          endGame();
          return;
        }

        if (obs.x + obs.width < 0) {
          obstacles.splice(i, 1);
        }
      }
    }

    function getObstacleColor(text) {
      if (text === "404") return "#ffcc00";
      if (text === "BUG") return "#ff4d6d";
      if (text === "500") return "#ff8844";
      if (text === "ERR") return "#ff6666";
      if (text === "DELAY") return "#00ccff";
      return "#cc99ff";
    }

    function checkCollision(a, b) {
      const padding = 6;

      return (
        a.x + padding < b.x + b.width &&
        a.x + a.width - padding > b.x &&
        a.y + padding < b.y + b.height &&
        a.y + a.height - padding > b.y
      );
    }

    function createDust() {
      particles.push({
        x: player.x + 8,
        y: groundY - 5,
        size: Math.random() * 3 + 2,
        speedX: Math.random() * -2 - 1,
        speedY: Math.random() * -1,
        life: 30
      });
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        p.x += p.speedX;
        p.y += p.speedY;
        p.life--;

        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function drawGame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawBackground();
      drawGround();
      drawParticles();
      drawPlayer();
      drawObstacles();

      if (!isPlaying && !isGameOver) {
        drawCenterText("PRESS START / SPACE", "#ffcc00", 30);
      }
    }

    function drawBackground() {
      ctx.fillStyle = "rgba(255, 255, 255, 0.05)";

      for (let i = 0; i < 70; i++) {
        const x = ((i * 157) - frame * 0.4) % canvas.width;
        const y = (i * 83) % 250;
        ctx.fillRect(x < 0 ? x + canvas.width : x, y, 2, 2);
      }

      ctx.fillStyle = "rgba(0, 204, 255, 0.08)";
      ctx.font = "16px Courier New";
      ctx.fillText("</>", 650 - (frame * 0.2 % 900), 80);
      ctx.fillText("{ }", 500 - (frame * 0.15 % 900), 140);
      ctx.fillText("npm", 720 - (frame * 0.25 % 900), 210);
    }

    function drawGround() {
      ctx.strokeStyle = "#ffcc00";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, groundY);
      ctx.lineTo(canvas.width, groundY);
      ctx.stroke();

      ctx.strokeStyle = "rgba(255, 204, 0, 0.25)";
      for (let x = -40; x < canvas.width; x += 40) {
        const offsetX = (x - frame * speed) % 40;
        ctx.beginPath();
        ctx.moveTo(offsetX, groundY + 22);
        ctx.lineTo(offsetX + 18, groundY + 8);
        ctx.stroke();
      }
    }

    function drawPlayer() {
      ctx.save();

      ctx.fillStyle = "#00ff99";
      ctx.shadowColor = "#00ff99";
      ctx.shadowBlur = 14;

      ctx.fillRect(player.x, player.y, player.width, player.height);

      ctx.shadowBlur = 0;

      ctx.fillStyle = "#05070d";
      ctx.font = "bold 18px Arial";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("</>", player.x + player.width / 2, player.y + player.height / 2);

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(player.x + 30, player.y + 8, 6, 6);

      ctx.restore();

      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
    }

    function drawObstacles() {
      obstacles.forEach(obs => {
        ctx.fillStyle = obs.color;
        ctx.shadowColor = obs.color;
        ctx.shadowBlur = 12;

        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

        ctx.shadowBlur = 0;

        ctx.strokeStyle = "#ffffff";
        ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);

        ctx.fillStyle = "#05070d";
        ctx.font = "bold 18px Courier New";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(obs.text, obs.x + obs.width / 2, obs.y + obs.height / 2);
      });

      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.fillStyle = `rgba(255, 204, 0, ${p.life / 30})`;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      });
    }

    function drawCenterText(text, color, size) {
      ctx.fillStyle = color;
      ctx.font = `bold ${size}px Arial`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.shadowColor = color;
      ctx.shadowBlur = 12;
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);
      ctx.shadowBlur = 0;
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
    }

    function endGame() {
      cancelAnimationFrame(animationId);
      isPlaying = false;
      isGameOver = true;

      const finalScore = score;
      const highestScore = Number(localStorage.getItem(HIGHEST_SCORE_KEY)) || 0;

      if (finalScore > highestScore) {
        localStorage.setItem(HIGHEST_SCORE_KEY, finalScore);
        highestScoreEl.textContent = finalScore;
        statusEl.textContent = "New Highest Score!";
      } else {
        statusEl.textContent = "Game Over";
      }

      drawGame();

      ctx.fillStyle = "rgba(0, 0, 0, 0.72)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#ff6666";
      ctx.font = "42px Arial";
      ctx.textAlign = "center";
      ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);

      ctx.fillStyle = "#ffcc00";
      ctx.font = "22px Arial";
      ctx.fillText(`Final Score: ${finalScore}`, canvas.width / 2, canvas.height / 2 + 25);

      ctx.textAlign = "left";

      score = 0;
      scoreEl.textContent = score;
    }

    document.addEventListener("keydown", (event) => {
      if (
        event.code === "Space" ||
        event.code === "ArrowUp" ||
        event.key === "w" ||
        event.key === "W"
      ) {
        event.preventDefault();
        if (event.repeat) return;
        jump();
      }
    });

    document.addEventListener("keyup", (event) => {
      if (
        event.code === "Space" ||
        event.code === "ArrowUp" ||
        event.key === "w" ||
        event.key === "W"
      ) {
        releaseJump();
      }
    });

    canvas.addEventListener("click", jump);
    startBtn.addEventListener("click", startGame);
    restartBtn.addEventListener("click", restartGame);
    jumpBtn.addEventListener("click", jump);
    jumpBtn.addEventListener("pointerdown", jump);
    jumpBtn.addEventListener("pointerup", releaseJump);
    jumpBtn.addEventListener("pointerleave", releaseJump);

    initGame();
  </script>

</body>
</html>
