<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 Runner</title>

  <link rel="stylesheet" href="./css/error.css" />
</head>
<body>

  <div class="wrapper">
    <h1>404 Runner</h1>

    <div class="panel">
      <div>Score: <span id="score">0</span></div>
      <div>Highest Score: <span id="highestScore">0</span></div>
      <div>Status: <span id="status">Ready</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="420"></canvas>

    <div class="controls">
      <button id="startBtn">Start</button>
      <button id="restartBtn">Restart</button>
      <button id="jumpBtn">Jump</button>
    </div>

    <div class="hint">
      Tekan Space, Arrow Up, klik canvas, atau tombol Jump untuk melompat. Hindari obstacle seperti 404, BUG, 500, dan DELAY.
    </div>

    <a class="back-link" href="./index.html">Kembali ke halaman utama</a>
  </div>

  <script src="./js/error.js"></script>

</body>
</html>
