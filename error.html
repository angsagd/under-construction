<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avoid the Errors</title>

  <link rel="stylesheet" href="./css/error.css" />
</head>
<body>

  <div class="wrapper">
    <h1>Avoid the Errors</h1>

    <div class="panel">
      <div>Score: <span id="score">0</span></div>
      <div>Highest Score: <span id="highestScore">0</span></div>
      <div>Status: <span id="status">Ready</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="420"></canvas>

    <div class="controls">
      <button id="startBtn">Start</button>
      <button id="restartBtn">Restart</button>
      <button id="jumpBtn">Jump</button>
    </div>

    <div class="hint">
      Press Space, Arrow Up, click the canvas, or use the Jump button to jump. Avoid obstacles like 404, BUG, 500, and DELAY.
    </div>

    <a class="back-link" href="./index.html">Back to home</a>
  </div>

  <script>window.counterPage="error";</script>
  <script src="./js/counter.js"></script>
  <script src="./js/error.js"></script>

</body>
</html>
